<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta
    name="theme-color"
    content="#0b0f14"
  >

  <meta
    name="description"
    content="Taska - Complete Tasks, Earn Rewards"
  >

  <title>Taska</title>

  <!-- Telegram Mini App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Taska Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>


<body>

  <main class="app">

    <!-- =========================
         HEADER
    ========================== -->

    <header class="header">

      <div class="user-area">

        <div
          class="avatar"
          id="avatar"
          aria-label="Profile"
        >
          T
        </div>

        <div>

          <div class="hello">
            Welcome back 👋
          </div>

          <div
            class="username"
            id="username"
          >
            Taska User
          </div>

        </div>

      </div>


      <button
        class="notification"
        id="notificationBtn"
        type="button"
        aria-label="Notifications"
      >
        🔔
      </button>

    </header>


    <!-- =========================
         BALANCE CARD
    ========================== -->

    <section
      class="balance-card"
      aria-label="Account balance"
    >

      <div class="balance-label">
        Available Balance
      </div>

      <div class="balance">
        ৳0.00
      </div>


      <div class="balance-bottom">

        <div class="today">

          Today's Earnings

          <strong>
            ৳0.00
          </strong>

        </div>


        <button
          class="withdraw-btn"
          id="withdrawBtn"
          type="button"
        >
          Withdraw
        </button>

      </div>

    </section>


    <!-- =========================
         QUICK EARN
    ========================== -->

    <div class="section-title">

      <h2>
        ⚡ Quick Earn
      </h2>

      <span>
        More ways coming
      </span>

    </div>


    <section class="earn-grid">


      <!-- Watch Ads -->

      <button
        class="earn-card"
        type="button"
        data-feature="Watch Ads"
      >

        <div class="earn-icon">
          🎬
        </div>

        <div class="earn-name">
          Watch Ads
        </div>

        <div class="earn-desc">
          Watch available ads and earn rewards
        </div>

      </button>


      <!-- Daily Check-in -->

      <button
        class="earn-card"
        type="button"
        data-feature="Daily Check-in"
      >

        <div class="earn-icon">
          📅
        </div>

        <div class="earn-name">
          Daily Check-in
        </div>

        <div class="earn-desc">
          Check in every day for rewards
        </div>

      </button>


      <!-- Tasks -->

      <button
        class="earn-card"
        type="button"
        data-feature="Tasks"
      >

        <div class="earn-icon">
          📋
        </div>

        <div class="earn-name">
          Tasks
        </div>

        <div class="earn-desc">
          Complete tasks and earn rewards
        </div>

      </button>


      <!-- Referral -->

      <button
        class="earn-card"
        type="button"
        data-feature="Referral"
      >

        <div class="earn-icon">
          👥
        </div>

        <div class="earn-name">
          Refer & Earn
        </div>

        <div class="earn-desc">
          Invite friends and earn bonuses
        </div>

      </button>

    </section>


    <!-- =========================
         STATISTICS
    ========================== -->

    <div class="section-title">

      <h2>
        📊 Your Statistics
      </h2>

    </div>


    <section class="stats">


      <div class="stat-card">

        <div class="stat-label">
          Total Earnings
        </div>

        <div class="stat-value">
          ৳0.00
        </div>

      </div>


      <div class="stat-card">

        <div class="stat-label">
          Referrals
        </div>

        <div class="stat-value">
          0
        </div>

      </div>


      <div class="stat-card">

        <div class="stat-label">
          Tasks Completed
        </div>

        <div class="stat-value">
          0
        </div>

      </div>


      <div class="stat-card">

        <div class="stat-label">
          Total Withdrawn
        </div>

        <div class="stat-value">
          ৳0.00
        </div>

      </div>

    </section>


    <!-- =========================
         RECENT TRANSACTIONS
    ========================== -->

    <div class="section-title">

      <h2>
        Recent Transactions
      </h2>

      <span>
        View all
      </span>

    </div>


    <section
      class="transactions"
      aria-label="Recent transactions"
    >

      <div class="empty">

        <div class="empty-icon">
          🧾
        </div>

        No transactions yet

      </div>

    </section>

  </main>


  <!-- =========================
       BOTTOM NAVIGATION
  ========================== -->

  <nav
    class="bottom-nav"
    aria-label="Main navigation"
  >


    <button
      class="nav-btn active"
      type="button"
      data-page="Home"
    >

      <span class="nav-icon">
        ⌂
      </span>

      <span>
        Home
      </span>

    </button>


    <button
      class="nav-btn"
      type="button"
      data-page="Earn"
    >

      <span class="nav-icon">
        ⚡
      </span>

      <span>
        Earn
      </span>

    </button>


    <button
      class="nav-btn"
      type="button"
      data-page="Referral"
    >

      <span class="nav-icon">
        👥
      </span>

      <span>
        Referral
      </span>

    </button>


    <button
      class="nav-btn"
      type="button"
      data-page="Wallet"
    >

      <span class="nav-icon">
        💳
      </span>

      <span>
        Wallet
      </span>

    </button>


    <button
      class="nav-btn"
      type="button"
      data-page="Profile"
    >

      <span class="nav-icon">
        👤
      </span>

      <span>
        Profile
      </span>

    </button>

  </nav>


  <!-- =========================
       TOAST MESSAGE
  ========================== -->

  <div
    class="toast"
    id="toast"
    role="status"
    aria-live="polite"
  ></div>


  <!-- =========================
       TASKA JAVASCRIPT
  ========================== -->

  <script src="app.js"></script>

</body>

  </html>
