<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta
    name="theme-color"
    content="#08111f"
  >

  <meta
    name="description"
    content="Taska - Earn rewards by completing tasks"
  >

  <title>Taska</title>

  <!-- Telegram Mini App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <link rel="stylesheet" href="style.css">
</head>


<body>

  <!-- SVG ICON SYSTEM -->
  <svg
    class="icon-sprite"
    xmlns="http://www.w3.org/2000/svg"
    aria-hidden="true"
  >

    <symbol id="icon-home" viewBox="0 0 24 24">
      <path d="M3 10.5 12 3l9 7.5"/>
      <path d="M5 9.5V21h14V9.5"/>
      <path d="M9 21v-6h6v6"/>
    </symbol>

    <symbol id="icon-bolt" viewBox="0 0 24 24">
      <path d="M13 2 4 14h7l-1 8 9-12h-7l1-8Z"/>
    </symbol>

    <symbol id="icon-users" viewBox="0 0 24 24">
      <circle cx="9" cy="8" r="4"/>
      <path d="M2.5 21c.6-4 2.8-6 6.5-6s5.9 2 6.5 6"/>
      <path d="M16 5.2a3.5 3.5 0 0 1 0 6.6"/>
      <path d="M17 15c2.8.4 4.2 2.1 4.5 5"/>
    </symbol>

    <symbol id="icon-wallet" viewBox="0 0 24 24">
      <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6.5A2.5 2.5 0 0 1 4 18.5v-13Z"/>
      <path d="M4 7h14.5a2.5 2.5 0 0 1 2.5 2.5V16h-5a3 3 0 0 1 0-6h5"/>
      <circle cx="16" cy="13" r=".8"/>
    </symbol>

    <symbol id="icon-user" viewBox="0 0 24 24">
      <circle cx="12" cy="8" r="4"/>
      <path d="M4 21c.8-4.2 3.4-6.5 8-6.5s7.2 2.3 8 6.5"/>
    </symbol>

    <symbol id="icon-bell" viewBox="0 0 24 24">
      <path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>
      <path d="M10 21h4"/>
    </symbol>

    <symbol id="icon-play" viewBox="0 0 24 24">
      <rect x="3" y="3" width="18" height="18" rx="5"/>
      <path d="m10 8 6 4-6 4V8Z"/>
    </symbol>

    <symbol id="icon-calendar" viewBox="0 0 24 24">
      <rect x="3" y="4.5" width="18" height="17" rx="3"/>
      <path d="M8 2.5v4M16 2.5v4M3 9h18"/>
      <path d="M8 13h.01M12 13h.01M16 13h.01M8 17h.01M12 17h.01"/>
    </symbol>

    <symbol id="icon-checklist" viewBox="0 0 24 24">
      <rect x="5" y="3" width="14" height="18" rx="2"/>
      <path d="m8 8 1.5 1.5L12 7M13.5 9H16"/>
      <path d="m8 13 1.5 1.5L12 12M13.5 14H16"/>
      <path d="M8 18h8"/>
    </symbol>

    <symbol id="icon-gift" viewBox="0 0 24 24">
      <rect x="3" y="9" width="18" height="12" rx="2"/>
      <path d="M12 9v12M2.5 9h19"/>
      <path d="M12 9H7.5a2.5 2.5 0 1 1 2.5-2.5C10 9 12 9 12 9ZM12 9h4.5A2.5 2.5 0 1 0 14 6.5C14 9 12 9 12 9Z"/>
    </symbol>

    <symbol id="icon-chart" viewBox="0 0 24 24">
      <path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>
    </symbol>

    <symbol id="icon-receipt" viewBox="0 0 24 24">
      <path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3Z"/>
      <path d="M9 8h6M9 12h6M9 16h4"/>
    </symbol>

    <symbol id="icon-share" viewBox="0 0 24 24">
      <circle cx="18" cy="5" r="3"/>
      <circle cx="6" cy="12" r="3"/>
      <circle cx="18" cy="19" r="3"/>
      <path d="m8.7 10.7 6.6-4M8.7 13.3l6.6 4"/>
    </symbol>

    <symbol id="icon-copy" viewBox="0 0 24 24">
      <rect x="8" y="8" width="12" height="12" rx="2"/>
      <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>
    </symbol>

    <symbol id="icon-arrow" viewBox="0 0 24 24">
      <path d="m9 18 6-6-6-6"/>
    </symbol>

    <symbol id="icon-arrow-up" viewBox="0 0 24 24">
      <path d="M12 19V5M6 11l6-6 6 6"/>
    </symbol>

    <symbol id="icon-eye" viewBox="0 0 24 24">
      <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/>
      <circle cx="12" cy="12" r="2.5"/>
    </symbol>

    <symbol id="icon-headphones" viewBox="0 0 24 24">
      <path d="M4 14v-2a8 8 0 0 1 16 0v2"/>
      <path d="M4 14a2 2 0 0 1 2-2h1v7H6a2 2 0 0 1-2-2v-3ZM20 14a2 2 0 0 0-2-2h-1v7h1a2 2 0 0 0 2-2v-3Z"/>
      <path d="M17 20c-1 .7-2.5 1-4 1"/>
    </symbol>

    <symbol id="icon-file" viewBox="0 0 24 24">
      <path d="M6 3h8l4 4v14H6V3Z"/>
      <path d="M14 3v5h4M9 12h6M9 16h6"/>
    </symbol>

    <symbol id="icon-shield" viewBox="0 0 24 24">
      <path d="M12 3 20 6v6c0 5-3.3 8-8 10-4.7-2-8-5-8-10V6l8-3Z"/>
      <path d="m8.5 12 2.2 2.2 4.8-5"/>
    </symbol>

    <symbol id="icon-info" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9"/>
      <path d="M12 11v6M12 7h.01"/>
    </symbol>

    <symbol id="icon-settings" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.8 1.8 0 0 0 .4 2l.1.1-1.8 1.8-.1-.1a1.8 1.8 0 0 0-2-.4 1.8 1.8 0 0 0-1.1 1.7V20h-2.6v-.1a1.8 1.8 0 0 0-1.1-1.7 1.8 1.8 0 0 0-2 .4l-.1.1-1.8-1.8.1-.1a1.8 1.8 0 0 0 .4-2 1.8 1.8 0 0 0-1.7-1.1H4v-2.6h.1a1.8 1.8 0 0 0 1.7-1.1 1.8 1.8 0 0 0-.4-2l-.1-.1 1.8-1.8.1.1a1.8 1.8 0 0 0 2 .4A1.8 1.8 0 0 0 10.3 7V6h2.6v1a1.8 1.8 0 0 0 1.1 1.7 1.8 1.8 0 0 0 2-.4l.1-.1 1.8 1.8-.1.1a1.8 1.8 0 0 0-.4 2 1.8 1.8 0 0 0 1.7 1.1h1v2.6h-1a1.8 1.8 0 0 0-1.7 1.2Z"/>
    </symbol>

    <symbol id="icon-log-out" viewBox="0 0 24 24">
      <path d="M10 5H5v14h5"/>
      <path d="M14 8l4 4-4 4M18 12H9"/>
    </symbol>

  </svg>


  <main class="app">

    <!-- HEADER -->

    <header class="header">

      <div class="user-area">

        <div
          class="avatar"
          id="avatar"
        >
          T
        </div>

        <div class="user-info">

          <div class="hello">
            Welcome back
          </div>

          <div
            class="username"
            id="username"
          >
            Taska User
          </div>

        </div>

      </div>


      <button
        class="icon-button"
        id="notificationBtn"
        type="button"
        aria-label="Notifications"
      >
        <svg>
          <use href="#icon-bell"></use>
        </svg>
      </button>

    </header>


    <!-- BALANCE -->

    <section class="balance-card">

      <div class="balance-glow"></div>

      <div class="balance-top">

        <div>

          <div class="balance-label">
            Available Balance
          </div>

          <div
            class="balance"
            id="balance"
          >
            ৳0.00
          </div>

        </div>

        <button
          class="balance-eye"
          type="button"
          aria-label="Balance visibility"
        >
          <svg>
            <use href="#icon-eye"></use>
          </svg>
        </button>

      </div>


      <div class="balance-bottom">

        <div class="today">

          <span>Today's Earnings</span>

          <strong>
            ৳0.00
          </strong>

        </div>


        <button
          class="withdraw-btn"
          id="withdrawBtn"
          type="button"
        >
          <svg>
            <use href="#icon-wallet"></use>
          </svg>

          Withdraw
        </button>

      </div>

    </section>


    <!-- QUICK EARN -->

    <div class="section-title">

      <div>
        <h2>
          <svg>
            <use href="#icon-bolt"></use>
          </svg>
          Quick Earn
        </h2>
      </div>

      <span>
        More ways coming
      </span>

    </div>


    <section class="quick-grid">

      <button
        class="quick-card"
        data-feature="Watch Ads"
        type="button"
      >

        <span class="quick-icon blue">
          <svg>
            <use href="#icon-play"></use>
          </svg>
        </span>

        <strong>Watch Ads</strong>

        <small>
          Watch ads and earn rewards
        </small>

      </button>


      <button
        class="quick-card"
        data-feature="Daily Check-in"
        type="button"
      >

        <span class="quick-icon green">
          <svg>
            <use href="#icon-calendar"></use>
          </svg>
        </span>

        <strong>Daily Check-in</strong>

        <small>
          Get your daily reward
        </small>

      </button>


      <button
        class="quick-card"
        data-feature="Tasks"
        type="button"
      >

        <span class="quick-icon orange">
          <svg>
            <use href="#icon-checklist"></use>
          </svg>
        </span>

        <strong>Tasks</strong>

        <small>
          Complete tasks and earn
        </small>

      </button>


      <button
        class="quick-card"
        data-feature="Referral"
        type="button"
      >

        <span class="quick-icon purple">
          <svg>
            <use href="#icon-users"></use>
          </svg>
        </span>

        <strong>Refer & Earn</strong>

        <small>
          Invite friends and earn
        </small>

      </button>

    </section>


    <!-- FEATURE BANNER -->

    <button
      class="feature-banner"
      type="button"
      data-feature="Special Offers"
    >

      <span class="banner-icon">
        <svg>
          <use href="#icon-gift"></use>
        </svg>
      </span>

      <span class="banner-content">

        <strong>
          Complete Simple Tasks
        </strong>

        <small>
          Earn real rewards by completing available tasks
        </small>

      </span>

      <span class="banner-arrow">
        <svg>
          <use href="#icon-arrow"></use>
        </svg>
      </span>

    </button>


    <!-- STATISTICS -->

    <div class="section-title">

      <h2>
        <svg>
          <use href="#icon-chart"></use>
        </svg>
        Your Statistics
      </h2>

      <button
        class="text-button"
        type="button"
        id="viewStats"
      >
        View all
      </button>

    </div>


    <section class="stats">

      <div class="stat-card">

        <span class="stat-icon">
          <svg>
            <use href="#icon-chart"></use>
          </svg>
        </span>

        <div>
          <span>Total Earnings</span>
          <strong>৳0.00</strong>
        </div>

      </div>


      <div class="stat-card">

        <span class="stat-icon">
          <svg>
            <use href="#icon-users"></use>
          </svg>
        </span>

        <div>
          <span>Referrals</span>
          <strong>0</strong>
        </div>

      </div>


      <div class="stat-card">

        <span class="stat-icon">
          <svg>
            <use href="#icon-checklist"></use>
          </svg>
        </span>

        <div>
          <span>Tasks Completed</span>
          <strong>0</strong>
        </div>

      </div>


      <div class="stat-card">

        <span class="stat-icon">
          <svg>
            <use href="#icon-wallet"></use>
          </svg>
        </span>

        <div>
          <span>Total Withdrawn</span>
          <strong>৳0.00</strong>
        </div>

      </div>

    </section>


    <!-- TRANSACTIONS -->

    <div class="section-title">

      <h2>
        <svg>
          <use href="#icon-receipt"></use>
        </svg>
        Recent Transactions
      </h2>

      <button
        class="text-button"
        type="button"
        id="viewTransactions"
      >
        View all
      </button>

    </div>


    <section class="transactions">

      <div class="empty">

        <span class="empty-icon">
          <svg>
            <use href="#icon-receipt"></use>
          </svg>
        </span>

        <strong>
          No transactions yet
        </strong>

        <span>
          Your earning history will appear here
        </span>

      </div>

    </section>

  </main>


  <!-- BOTTOM NAV -->

  <nav
    class="bottom-nav"
    aria-label="Main navigation"
  >

    <button
      class="nav-btn active"
      type="button"
      data-page="Home"
    >
      <svg>
        <use href="#icon-home"></use>
      </svg>

      <span>Home</span>
    </button>


    <button
      class="nav-btn"
      type="button"
      data-page="Earn"
    >
      <svg>
        <use href="#icon-bolt"></use>
      </svg>

      <span>Earn</span>
    </button>


    <button
      class="nav-btn"
      type="button"
      data-page="Referral"
    >
      <svg>
        <use href="#icon-users"></use>
      </svg>

      <span>Referral</span>
    </button>


    <button
      class="nav-btn"
      type="button"
      data-page="Wallet"
    >
      <svg>
        <use href="#icon-wallet"></use>
      </svg>

      <span>Wallet</span>
    </button>


    <button
      class="nav-btn"
      type="button"
      data-page="Profile"
    >
      <svg>
        <use href="#icon-user"></use>
      </svg>

      <span>Profile</span>
    </button>

  </nav>


  <!-- TOAST -->

  <div
    class="toast"
    id="toast"
    role="status"
    aria-live="polite"
  ></div>


  <script src="app.js"></script>

</body>

  </html>
