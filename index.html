<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>Taska</title>

  <!-- Telegram Mini App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0b0f14;
      --card: #121820;
      --card2: #171f29;
      --text: #ffffff;
      --muted: #8d99a8;
      --accent: #4f8cff;
      --accent2: #6b5cff;
      --border: rgba(255, 255, 255, 0.07);
      --success: #39d98a;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
    }

    button {
      font-family: inherit;
    }

    .app {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      padding: 18px 16px 95px;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .user-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
      overflow: hidden;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hello {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 3px;
    }

    .username {
      font-size: 17px;
      font-weight: 700;
    }

    .notification {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: var(--card);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
    }

    /* Balance */
    .balance-card {
      position: relative;
      overflow: hidden;
      padding: 22px;
      border-radius: 24px;
      background:
        linear-gradient(135deg, #172238, #121925);
      border: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 18px;
    }

    .balance-card::after {
      content: "";
      position: absolute;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: rgba(79, 140, 255, 0.08);
      right: -70px;
      top: -70px;
    }

    .balance-label {
      color: #aab5c4;
      font-size: 13px;
      margin-bottom: 7px;
    }

    .balance {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 18px;
    }

    .balance-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .today {
      font-size: 13px;
      color: #aab5c4;
    }

    .today strong {
      color: var(--success);
      display: block;
      margin-top: 3px;
      font-size: 15px;
    }

    .withdraw-btn {
      border: none;
      background: white;
      color: #10151b;
      padding: 11px 16px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Section */
    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 23px 2px 12px;
    }

    .section-title h2 {
      font-size: 18px;
      font-weight: 750;
    }

    .section-title span {
      color: var(--muted);
      font-size: 12px;
    }

    /* Quick cards */
    .earn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 11px;
    }

    .earn-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 17px;
      min-height: 125px;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .earn-card:active {
      transform: scale(0.97);
    }

    .earn-icon {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      background: var(--card2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      margin-bottom: 13px;
    }

    .earn-name {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .earn-desc {
      color: var(--muted);
      font-size: 11px;
    }

    /* Stats */
    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 11px;
    }

    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 17px;
    }

    .stat-label {
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 7px;
    }

    .stat-value {
      font-size: 19px;
      font-weight: 750;
    }

    /* Transactions */
    .transactions {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
    }

    .empty {
      padding: 27px 15px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    .empty-icon {
      font-size: 26px;
      margin-bottom: 8px;
      opacity: 0.7;
    }

    /* Bottom navigation */
    .bottom-nav {
      position: fixed;
      left: 50%;
      bottom: 10px;
      transform: translateX(-50%);
      width: calc(100% - 22px);
      max-width: 578px;
      padding: 8px;
      border-radius: 20px;
      background: rgba(18, 24, 32, 0.94);
      border: 1px solid var(--border);
      backdrop-filter: blur(16px);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      z-index: 100;
    }

    .nav-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      min-height: 55px;
      border-radius: 14px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-size: 10px;
    }

    .nav-btn .nav-icon {
      font-size: 18px;
    }

    .nav-btn.active {
      color: white;
      background: rgba(79, 140, 255, 0.14);
    }

    /* Toast */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 82px;
      transform: translateX(-50%) translateY(15px);
      background: #202832;
      color: white;
      padding: 11px 16px;
      border-radius: 12px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s ease;
      z-index: 200;
      white-space: nowrap;
      border: 1px solid var(--border);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 350px) {
      .app {
        padding-left: 12px;
        padding-right: 12px;
      }

      .balance {
        font-size: 30px;
      }

      .earn-card {
        padding: 14px;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <!-- Header -->
    <header class="header">

      <div class="user-area">

        <div class="avatar" id="avatar">
          T
        </div>

        <div>
          <div class="hello">Welcome back 👋</div>
          <div class="username" id="username">
            Taska User
          </div>
        </div>

      </div>

      <button class="notification" type="button" id="notificationBtn">
        🔔
      </button>

    </header>


    <!-- Balance -->
    <section class="balance-card">

      <div class="balance-label">
        Available Balance
      </div>

      <div class="balance">
        ৳0.00
      </div>

      <div class="balance-bottom">

        <div class="today">
          Today's Earnings
          <strong>৳0.00</strong>
        </div>

        <button class="withdraw-btn" type="button" id="withdrawBtn">
          Withdraw
        </button>

      </div>

    </section>


    <!-- Quick Earn -->
    <div class="section-title">
      <h2>⚡ Quick Earn</h2>
      <span>More ways coming</span>
    </div>

    <section class="earn-grid">

      <button class="earn-card" type="button" data-feature="Watch Ads">

        <div class="earn-icon">🎬</div>

        <div class="earn-name">
          Watch Ads
        </div>

        <div class="earn-desc">
          Watch available ads and earn rewards
        </div>

      </button>


      <button class="earn-card" type="button" data-feature="Daily Check-in">

        <div class="earn-icon">📅</div>

        <div class="earn-name">
          Daily Check-in
        </div>

        <div class="earn-desc">
          Check in every day for rewards
        </div>

      </button>


      <button class="earn-card" type="button" data-feature="Tasks">

        <div class="earn-icon">📋</div>

        <div class="earn-name">
          Tasks
        </div>

        <div class="earn-desc">
          Complete tasks and earn rewards
        </div>

      </button>


      <button class="earn-card" type="button" data-feature="Referral">

        <div class="earn-icon">👥</div>

        <div class="earn-name">
          Refer & Earn
        </div>

        <div class="earn-desc">
          Invite friends and earn bonuses
        </div>

      </button>

    </section>


    <!-- Statistics -->
    <div class="section-title">
      <h2>📊 Your Statistics</h2>
    </div>

    <section class="stats">

      <div class="stat-card">
        <div class="stat-label">
          Total Earnings
        </div>
        <div class="stat-value">
          ৳0.00
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-label">
          Referrals
        </div>
        <div class="stat-value">
          0
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-label">
          Tasks Completed
        </div>
        <div class="stat-value">
          0
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-label">
          Total Withdrawn
        </div>
        <div class="stat-value">
          ৳0.00
        </div>
      </div>

    </section>


    <!-- Transactions -->
    <div class="section-title">
      <h2>Recent Transactions</h2>
      <span>View all</span>
    </div>

    <section class="transactions">

      <div class="empty">

        <div class="empty-icon">
          🧾
        </div>

        No transactions yet

      </div>

    </section>

  </main>


  <!-- Bottom Navigation -->
  <nav class="bottom-nav">

    <button class="nav-btn active" type="button" data-page="Home">
      <span class="nav-icon">⌂</span>
      <span>Home</span>
    </button>

    <button class="nav-btn" type="button" data-page="Earn">
      <span class="nav-icon">⚡</span>
      <span>Earn</span>
    </button>

    <button class="nav-btn" type="button" data-page="Referral">
      <span class="nav-icon">👥</span>
      <span>Referral</span>
    </button>

    <button class="nav-btn" type="button" data-page="Wallet">
      <span class="nav-icon">💳</span>
      <span>Wallet</span>
    </button>

    <button class="nav-btn" type="button" data-page="Profile">
      <span class="nav-icon">👤</span>
      <span>Profile</span>
    </button>

  </nav>


  <div class="toast" id="toast"></div>


  <script>

    /*
      TASKA TELEGRAM MINI APP
      --------------------------------
      This is the first frontend MVP.

      IMPORTANT:
      Telegram initDataUnsafe is used ONLY for displaying
      UI information.

      NEVER trust initDataUnsafe for authentication,
      balance, rewards or withdrawals.

      Later, the backend will verify Telegram initData
      securely on the server.
    */


    const tg = window.Telegram?.WebApp;


    // Initialize Telegram Mini App
    if (tg) {

      try {

        tg.ready();

        tg.expand();

        // Use Telegram theme if available
        if (tg.themeParams) {

          const root = document.documentElement;

          if (tg.themeParams.bg_color) {
            root.style.setProperty(
              "--bg",
              tg.themeParams.bg_color
            );
          }

          if (tg.themeParams.text_color) {
            root.style.setProperty(
              "--text",
              tg.themeParams.text_color
            );
          }

          if (tg.themeParams.hint_color) {
            root.style.setProperty(
              "--muted",
              tg.themeParams.hint_color
            );
          }

          if (tg.themeParams.button_color) {
            root.style.setProperty(
              "--accent",
              tg.themeParams.button_color
            );
          }

        }

      } catch (error) {

        console.log(
          "Telegram initialization error:",
          error
        );

      }

    }


    // Get Telegram user
    const telegramUser =
      tg?.initDataUnsafe?.user || null;


    // Show Telegram user information
    if (telegramUser) {

      const firstName =
        telegramUser.first_name || "User";

      const username =
        telegramUser.username
          ? "@" + telegramUser.username
          : firstName;

      document.getElementById(
        "username"
      ).textContent = username;


      // Profile photo
      if (telegramUser.photo_url) {

        const avatar =
          document.getElementById("avatar");

        avatar.innerHTML =
          `<img src="${telegramUser.photo_url}" alt="Profile">`;

      } else {

        document.getElementById(
          "avatar"
        ).textContent =
          firstName.charAt(0).toUpperCase();

      }

    }


    // Toast
    function showToast(message) {

      const toast =
        document.getElementById("toast");

      toast.textContent = message;

      toast.classList.add("show");

      setTimeout(() => {

        toast.classList.remove("show");

      }, 1800);

    }


    // Bottom navigation
    document
      .querySelectorAll(".nav-btn")
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            const page =
              button.dataset.page;

            document
              .querySelectorAll(".nav-btn")
              .forEach(btn => {

                btn.classList.remove("active");

              });

            button.classList.add("active");

            if (page !== "Home") {

              showToast(
                page + " section coming soon"
              );

            }

          }
        );

      });


    // Quick earn cards
    document
      .querySelectorAll(".earn-card")
      .forEach(card => {

        card.addEventListener(
          "click",
          () => {

            const feature =
              card.dataset.feature;

            showToast(
              feature + " is coming soon"
            );

          }
        );

      });


    // Withdraw
    document
      .getElementById("withdrawBtn")
      .addEventListener(
        "click",
        () => {

          showToast(
            "Withdrawal will be available soon"
          );

        }
      );


    // Notification
    document
      .getElementById("notificationBtn")
      .addEventListener(
        "click",
        () => {

          showToast(
            "No new notifications"
          );

        }
      );


  </script>

</body>
    </html>
